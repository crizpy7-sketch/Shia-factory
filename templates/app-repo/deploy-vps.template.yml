# Copy this file to .github/workflows/deploy-vps.yml in an app repository,
# then adapt the marked project-specific values.
#
# Default architecture:
#   GitHub Actions builds production images.
#   The VPS receives finished images and performs load -> migrate -> start -> health gate.
#   The VPS is a runtime target, not the normal compilation host.
#
# Required GitHub Actions secrets:
#   VPS_HOST
#   VPS_USER
#   VPS_PORT
#   VPS_SSH_KEY_B64
#
# Required server-side file:
#   /opt/<APP_NAME>/deploy/.env.production
#
# This template intentionally keeps production secrets out of GitHub source.

name: Deploy App to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY_B64" || { echo "Missing VPS_SSH_KEY_B64"; exit 1; }

      - name: Build production images on GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          # PROJECT-SPECIFIC: change image names / Dockerfiles once per repo.
          APP_IMAGE="CHANGE_ME:latest"
          WEB_IMAGE="CHANGE_ME-web:latest"

          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f deploy/Dockerfile \
            -t "$APP_IMAGE" \
            .

          # Remove this second build if the app has only one image.
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f deploy/web.Dockerfile \
            -t "$WEB_IMAGE" \
            .

          docker save "$APP_IMAGE" "$WEB_IMAGE" | gzip -1 > /tmp/app-images.tar.gz
          test -s /tmp/app-images.tar.gz
          echo "Prebuilt image bundle: $(du -h /tmp/app-images.tar.gz | cut -f1)"

      - name: Package release metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/app-release.tgz .
          test -s /tmp/app-release.tgz

      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer prebuilt release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -i ~/.ssh/deploy_key)
          scp "${SSH_OPTS[@]}" -P "$PORT" /tmp/app-release.tgz "$VPS_USER@$VPS_HOST:/tmp/app-release.tgz"
          scp "${SSH_OPTS[@]}" -P "$PORT" /tmp/app-images.tar.gz "$VPS_USER@$VPS_HOST:/tmp/app-images.tar.gz"

      - name: Load and deploy prebuilt images
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"

          # PROJECT-SPECIFIC: change once per repository.
          APP_NAME="CHANGE_ME"

          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            "$VPS_USER@$VPS_HOST" \
            "APP_NAME='$APP_NAME' bash -se" <<'REMOTE'
          set -euo pipefail

          APP_DIR="/opt/${APP_NAME}"
          sudo mkdir -p "$APP_DIR"
          sudo tar -xzf /tmp/app-release.tgz -C "$APP_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"
          cd "$APP_DIR"

          command -v docker >/dev/null 2>&1 || { echo "Docker missing"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose missing"; exit 1; }
          test -f deploy/.env.production || { echo "Missing deploy/.env.production"; exit 1; }
          test -f deploy/docker-compose.yml || { echo "Missing deploy/docker-compose.yml"; exit 1; }
          test -s /tmp/app-images.tar.gz || { echo "Missing prebuilt image bundle"; exit 1; }

          echo "Loading CI-built production images. No app compilation occurs on this VPS."
          gzip -dc /tmp/app-images.tar.gz | docker load

          COMPOSE="docker compose --env-file deploy/.env.production -f deploy/docker-compose.yml"
          $COMPOSE config >/dev/null

          # PROJECT-SPECIFIC OPTIONAL MIGRATION EXAMPLE:
          # Use -T and </dev/null so a one-off container cannot consume the
          # parent SSH here-document.
          # $COMPOSE run -T --rm --no-deps api ./bin/migrate </dev/null

          $COMPOSE up -d --no-build --remove-orphans
          $COMPOSE ps
          rm -f /tmp/app-release.tgz /tmp/app-images.tar.gz
          REMOTE

      - name: Production health gate
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"

          # PROJECT-SPECIFIC: change once per repository.
          APP_NAME="CHANGE_ME"

          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            "$VPS_USER@$VPS_HOST" \
            "APP_NAME='$APP_NAME' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "/opt/${APP_NAME}"

          COMPOSE="docker compose --env-file deploy/.env.production -f deploy/docker-compose.yml"

          # PROJECT-SPECIFIC: replace these comments with real application gates.
          # A shallow process check alone is not enough. Verify at least the
          # user-facing health route and any critical API/worker/daemon state.

          $COMPOSE ps
          echo "IMPORTANT: replace template health section with real app health gates before production use."
          docker image prune -f >/dev/null || true
          REMOTE
